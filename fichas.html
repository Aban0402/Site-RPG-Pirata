<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minhas Fichas - RPG Forge</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <main class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-amber-400 mb-6">Minhas Fichas Salvas</h1>
        <div id="listaFichas" class="grid gap-4">
        </div>
        <a href="index.html" class="inline-block mt-6 bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded">Voltar ao Início</a>
    </main>

    <script>
        function abrirFichaSalva(ficha) {
            localStorage.setItem('fichaSelecionada', JSON.stringify(ficha));
            window.location.href = 'index.html';
        }

        async function carregarMinhasFichas() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Você precisa estar logado!');
                window.location.href = 'login.html';
                return;
            }

            try {
                const resposta = await fetch('/api/minhas-fichas', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const fichas = await resposta.json();

                const container = document.getElementById('listaFichas');
                if (fichas.length === 0) {
                    container.innerHTML = '<p class="text-gray-400">Nenhuma ficha salva encontrada.</p>';
                    return;
                }

                container.innerHTML = fichas.map(ficha => `
                    <div class="bg-slate-800 p-4 rounded-lg shadow border border-slate-700 flex justify-between items-center">
                        <div>
                            <h3 class="text-xl font-bold text-amber-300">${ficha.nome}</h3>
                            <p class="text-sm text-gray-300">Sistema: ${ficha.sistema} | Raça: ${ficha.raca} | Classe: ${ficha.classe}</p>
                            <p class="text-xs text-gray-500 mt-1">Criado em: ${new Date(ficha.criado_em).toLocaleDateString('pt-BR')}</p>
                        </div>
                        <button onclick='abrirFichaSalva(${JSON.stringify(ficha)})' class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-4 py-2 rounded text-sm cursor-pointer">
                            📜 Abrir Ficha
                        </button>
                    </div>
                `).join('');
            } catch (erro) {
                console.error('Erro ao buscar fichas:', erro);
            }
        }

        carregarMinhasFichas();
    </script>
</body>
</html>
