<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>RPG Forge - Autenticação</title>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-xl shadow-xl max-w-md w-full border border-slate-700">
        <div class="flex border-b border-slate-700 mb-6">
            <button id="tabLogin" onclick="mudarAba('login')" class="flex-1 py-2 font-bold text-amber-400 border-b-2 border-amber-400">Entrar</button>
            <button id="tabRegister" onclick="mudarAba('register')" class="flex-1 py-2 font-bold text-gray-400 hover:text-white">Criar Conta</button>
        </div>

        <form id="formLogin" class="space-y-4">
            <h2 class="text-2xl font-bold text-amber-400 text-center mb-2">Entrar no Forge</h2>
            <div>
                <label class="block text-sm text-gray-400 mb-1">E-mail</label>
                <input type="email" id="loginEmail" required class="w-full p-3 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-amber-400">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Senha</label>
                <input type="password" id="loginSenha" required class="w-full p-3 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-amber-400">
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded transition-all">Entrar</button>
        </form>

        <form id="formRegister" class="space-y-4 hidden">
            <h2 class="text-2xl font-bold text-amber-400 text-center mb-2">Criar Nova Conta</h2>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Nome de Aventureiro / Mestre</label>
                <input type="text" id="regNome" required class="w-full p-3 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-amber-400">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">E-mail</label>
                <input type="email" id="regEmail" required class="w-full p-3 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-amber-400">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Senha</label>
                <input type="password" id="regSenha" required class="w-full p-3 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-amber-400">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded transition-all">Cadastrar</button>
        </form>

        <hr class="border-slate-700 my-6">

        <a href="index.html" class="text-amber-400 hover:underline text-sm flex items-center justify-center gap-1">
            ⬅ Voltar para o Forjador
        </a>
    </div>

    <script>
        function mudarAba(aba) {
            const formLogin = document.getElementById('formLogin');
            const formRegister = document.getElementById('formRegister');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');

            if (aba === 'login') {
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
                tabLogin.className = "flex-1 py-2 font-bold text-amber-400 border-b-2 border-amber-400";
                tabRegister.className = "flex-1 py-2 font-bold text-gray-400 hover:text-white";
            } else {
                formLogin.classList.add('hidden');
                formRegister.classList.remove('hidden');
                tabRegister.className = "flex-1 py-2 font-bold text-amber-400 border-b-2 border-amber-400";
                tabLogin.className = "flex-1 py-2 font-bold text-gray-400 hover:text-white";
            }
        }

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    alert('✨ Login realizado com sucesso!');
                    window.location.href = 'index.html';
                } else {
                    alert('❌ ' + data.erro);
                }
            } catch (err) {
                alert('❌ Erro ao conectar ao servidor.');
            }
        });

        document.getElementById('formRegister').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('regNome').value;
            const email = document.getElementById('regEmail').value;
            const senha = document.getElementById('regSenha').value;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });

                const data = await res.json();
                if (res.ok) {
                    alert('Conta criada com sucesso! Faça login para continuar.');
                    mudarAba('login');
                } else {
                    alert('❌ ' + data.erro);
                }
            } catch (err) {
                alert('❌ Erro ao conectar ao servidor.');
            }
        });
    </script>
</body>
</html>
